version: '3.9'

# ============================================================
# RailBlock AI — Docker Compose (Local Development)
# SIH PS 26027
#
# Ports used (chosen to avoid conflicts with other projects):
#   postgres    → host:5435  (container: 5432)
#   backend     → host:8090  (container: 8080)
#   frontend    → host:3001  (container: 80)
#   ml-service  → host:8000  (container: 8000)  ← already running
# ============================================================

services:

  # ---- PostgreSQL 15 ----
  postgres:
    image: postgres:15-alpine
    container_name: railblock-postgres
    environment:
      POSTGRES_DB: railway_blocks
      POSTGRES_USER: railway
      POSTGRES_PASSWORD: railway
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railway -d railway_blocks"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Spring Boot Backend ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: railblock-backend
    ports:
      - "8090:8080"
    environment:
      # Internal Docker network — containers talk on container ports (5432, 8080)
      DB_URL: jdbc:postgresql://postgres:5432/railway_blocks
      DB_USER: railway
      DB_PASS: railway
      PORT: 8080
      SCORING_MODE: RULE_BASED
      SCORING_ML_SERVICE_URL: http://ml-service:8000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ---- React Frontend (DECOUPLED) ----
  # VITE_API_BASE_URL uses the HOST port (8090) because the
  # browser (outside Docker) accesses the backend via the host.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8090
    container_name: railblock-frontend
    ports:
      - "3001:80"
    depends_on:
      - backend

  # ---- ML Scoring Microservice (Optional) ----
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: railblock-ml
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
